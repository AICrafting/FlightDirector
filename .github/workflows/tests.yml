---
name: tests
on:
  workflow_dispatch:

  push:
    branches: [develop]
  pull_request: {}

jobs:
  script-tests:
    name: script tests
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Setup tools
        run: |
          apk add --update npm bash gawk git coreutils jq

      - name: Checkout
        uses: actions/checkout@v6

      - name: Run script tests
        run: |
          bash scripts/runTests.sh
