---
name: tests
on:
  workflow_dispatch:

  push:
    branches: [develop]
  pull_request: {}

# The docs-only cheap path (FJ-235). On a PR whose every changed path is on the allowlist in
# scripts/ci/docs-only.sh (files no test reads), each leg still RUNS and reports `success`,
# but skips its install and test STEPS. Never the job: a skipped job makes `flight ci watch`
# report `status=skipped` ("CI ran nothing"), and Forgejo posts a `success` commit status for
# a skipped job — green for work that never ran. Each leg classifies for itself (step id
# `cheap`), and a push — the post-merge record on develop — has no PR number, so it always
# runs in full. The classifier fails open: any error leaves `cheap` unset or false.
jobs:
  script-tests:
    name: script tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      # Report both interpreters on a failure; one being red is useful information
      # about the other, not a reason to cancel it.
      fail-fast: false
      matrix:
        include:
          # The baseline: a current bash, which is what CI has always run.
          #
          # Pinned, not `alpine:latest`: a floating base can change the bash,
          # BusyBox and coreutils under the tests between two runs of the same
          # commit (#167). 3.22 deliberately matches the alpine3.22 in the
          # bash 3.2 image below, so the two Linux legs differ in the
          # interpreter and nothing else — which is the point of the matrix.
          # Bump both together.
          #
          # `bootstrap` is what checking out and classifying need (node for the
          # checkout action, git, a bash); `packages` is the rest, which the
          # docs-only cheap path skips.
          - name: bash 5
            image: alpine:3.22.6
            bootstrap: npm git bash
            packages: gawk coreutils jq python3

          # macOS ships bash 3.2.57 and nothing newer, so `/usr/bin/env bash` there
          # is 3.2 and anything bash 4+ (mapfile, declare -A) dies at runtime (#127).
          # This is that exact version, so the interpreter half of "does it work on a
          # Mac" is answerable on a Linux runner. shellcheck cannot cover this: the
          # shebang says `bash`, so it assumes 4+ and accepts both.
          #
          # Deliberately NO `bash` package here — apk's bash is 5.x and would install
          # to /bin/bash, shadowing the image's 3.2 at /usr/local/bin/bash and quietly
          # turning this leg into a duplicate of the one above.
          - name: bash 3.2
            image: bash:3.2.57-alpine3.22
            bootstrap: npm git
            packages: gawk coreutils jq python3
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Setup checkout tools
        run: |
          apk add --update ${{ matrix.bootstrap }}

      - name: Checkout
        uses: actions/checkout@v6

      - name: Classify the change (docs-only cheap path?)
        id: cheap
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          bash scripts/ci/docs-only.sh --pr "$PR_NUMBER" --base "$BASE_REF"

      - name: Setup tools
        if: steps.cheap.outputs.cheap != 'true'
        run: |
          # python3: the prompt-logger producers/summary (stdlib only) and their tests
          apk add --update ${{ matrix.packages }}

      - name: Show the interpreter under test
        run: |
          command -v bash
          bash --version | head -1
          printf 'nproc -> %s\n' "$(nproc 2>/dev/null || echo MISSING)"

      - name: Run script tests
        if: steps.cheap.outputs.cheap != 'true'
        run: |
          bash scripts/run-tests.sh

  # The other half of "does it work on a Mac": BSD userland. The Linux legs above
  # cover the interpreter but run GNU coreutils, so they cannot see a BSD `wc`
  # padding its count, `paste` demanding an explicit operand, or `sed -i` reading
  # the next token as a backup suffix.
  #
  # No `container:` here — only the docker-labelled Linux runners can take one, and
  # the point of this leg is the host's own tools. The runner has stock bash 3.2.57
  # (no Homebrew bash), plus git, jq and python3, so nothing needs installing.
  script-tests-macos:
    name: script tests (macOS, BSD userland)
    runs-on: macos-arm64
    timeout-minutes: 10
    steps:
      # actions/checkout is a JavaScript action and this runner has no node, so it
      # fails before the tests run ("Cannot find: node in PATH"). Check out with git
      # directly instead. The token goes through env and is never interpolated into
      # the script body, and extraheader keeps it out of the on-disk remote config.
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Never let git block on a credential prompt: with no tty it hangs until
          # the job timeout instead of failing, which reports as a timeout and hides
          # the real cause. Fail immediately instead, and keep pagers out of it.
          export GIT_TERMINAL_PROMPT=0 GIT_PAGER=cat PAGER=cat GIT_ASKPASS=/usr/bin/true
          [ -n "$TOKEN" ] || { echo "no token in github.token — cannot fetch"; exit 1; }
          git init -q .
          git remote add origin "$SERVER/$REPO.git"
          AUTH="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c credential.helper= -c http.extraheader="AUTHORIZATION: basic $AUTH" \
              fetch --no-tags --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD
          git --no-pager log --oneline -1
          # The docs-only classifier compares against origin/<base>, and the auth header
          # above is per-command, so the classifier cannot fetch it by itself. A failure
          # here only means the classifier fails open to a full run.
          if [ -n "$BASE_REF" ]; then
            git -c credential.helper= -c http.extraheader="AUTHORIZATION: basic $AUTH" \
                fetch --no-tags --depth 1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" \
              || echo "could not fetch base $BASE_REF; the classifier will choose a full run"
          fi

      - name: Classify the change (docs-only cheap path?)
        id: cheap
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          bash scripts/ci/docs-only.sh --pr "$PR_NUMBER" --base "$BASE_REF"

      - name: Show the interpreter under test
        run: |
          sw_vers
          command -v bash
          bash --version | head -1
          printf 'cores -> %s\n' "$(sysctl -n hw.ncpu 2>/dev/null || echo MISSING)"

      - name: Run script tests
        if: steps.cheap.outputs.cheap != 'true'
        run: |
          bash scripts/run-tests.sh

  # Windows, via Git Bash (MSYS). Not a third interpreter test: Git Bash is bash
  # 5.3, so this leg is about MSYS userland and Windows path form, the same way
  # the macOS leg is about BSD userland.
  #
  # Two things have to be set up rather than assumed, and both are why a plain
  # `runs-on: windows` leg fails for reasons that look like code bugs:
  #   PATH  C:\Windows\System32\sort.exe shadows the POSIX sort. It has no -u,
  #         and reports the flag as a missing file, so `branches` fails with
  #         "out=-uThe system cannot find the file specified." Put /usr/bin first.
  #         /mingw64/bin comes next, ahead of the inherited PATH, so `git` is the
  #         real /mingw64/bin/git.exe rather than /cmd/git.exe — the launcher,
  #         which spawns the real binary as a SECOND process. On a leg where every
  #         spawn is a CreateProcess plus an address-space copy, halving the
  #         process count of the most-called tool is the cheapest win left (#214).
  #         Deliberately AFTER /usr/bin, not before it: /mingw64/bin must not be
  #         allowed to win a tool that /usr/bin is here to provide, `sort` above all.
  #   jq    absent on the runner. Installed below; the CRLF its native build
  #         writes is handled in flight/scripts/_portable.sh, not here, because a
  #         user installing jq from winget or scoop gets exactly the same build.
  script-tests-windows:
    name: script tests (Windows, MSYS)
    runs-on: windows
    timeout-minutes: 20
    # Only where a Windows regression would ship (FJ-305): pull requests into qa and
    # main — the promotions, and main → qa's sync-down — plus a manual dispatch. Not
    # on PRs into develop or on pushes to it: this leg takes ~11 minutes against ~1 for
    # the others, and it set the critical path for every feature PR. A Windows-only
    # failure therefore surfaces at promotion to qa; CONTRIBUTING.md has the local
    # CRLF check that catches the commonest kind earlier.
    #
    # A job-level skip, unlike the docs-only path's step skip: the other legs still
    # run, so `flight ci watch` reads the run as a pass with `skipped=1`, never as
    # "CI ran nothing".
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.base_ref == 'qa' || github.base_ref == 'main'))
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Classify the change (docs-only cheap path?)
        id: cheap
        continue-on-error: true
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          export PATH="/usr/bin:/mingw64/bin:$PATH"
          bash scripts/ci/docs-only.sh --pr "$PR_NUMBER" --base "$BASE_REF"

      # python3 for the prompt-logger producers and their tests. winget is not
      # usable here (the runner is a service account with no interactive source
      # agreement), so use the action; node is present on this runner, unlike the
      # macOS one, so JS actions do run.
      - name: Set up python3
        if: steps.cheap.outputs.cheap != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install jq
        if: steps.cheap.outputs.cheap != 'true'
        shell: bash
        run: |
          # The sha256 is the one jq publishes in the release's own sha256sum.txt
          # for this asset; the step runs the download, so verify it before doing so.
          JQ_URL=https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-windows-amd64.exe
          JQ_SHA256=7451fbbf37feffb9bf262bd97c54f0da558c63f0748e64152dd87b0a07b6d6ab
          mkdir -p "$HOME/bin"
          # -f so an HTTP error fails here with curl's own message. Without it curl
          # saves the error page as jq.exe and exits 0, and the leg dies one line
          # later on `jq.exe: line 1: <!DOCTYPE html>`, which names neither the
          # download nor the reason (#166). --retry so a transient 5xx or timeout
          # does not fail the leg at all.
          curl -fsSL --retry 3 --retry-delay 5 -o "$HOME/bin/jq.exe" "$JQ_URL"
          printf '%s  %s\n' "$JQ_SHA256" "$HOME/bin/jq.exe" | sha256sum -c -
          "$HOME/bin/jq.exe" --version
          # setup-python installs `python`; the scripts invoke `python3`.
          if ! command -v python3 >/dev/null 2>&1 && command -v python >/dev/null 2>&1; then
            printf '#!/bin/bash\nexec python "$@"\n' >"$HOME/bin/python3"
            chmod +x "$HOME/bin/python3"
          fi

      - name: Show the environment under test
        if: steps.cheap.outputs.cheap != 'true'
        shell: bash
        run: |
          export PATH="/usr/bin:/mingw64/bin:$HOME/bin:$PATH"
          uname -a
          bash --version | head -1
          # run-tests.sh sizes its worker pool from this (#212), so a timing
          # change on this leg is only readable next to the width it ran at.
          printf 'nproc -> %s\n' "$(nproc 2>/dev/null || echo MISSING)"
          for t in sort jq git python3; do
            printf '%s -> %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done
          git --version
          # #214: git must resolve to /mingw64/bin, the real binary, NOT /cmd, the
          # Git for Windows launcher that starts it as a second process. `sort` must
          # still come from /usr/bin — that precedence is why /usr/bin leads (#130),
          # and /mingw64/bin sits after it precisely so this cannot regress.
          #
          # Reported rather than asserted: if this runner has no /mingw64/bin the PATH
          # change is a harmless no-op, and a timing that then fails to move should
          # read as "the change did not apply here", not as "the idea was wrong".
          if [ -d /mingw64/bin ]; then
            printf '#214 /mingw64/bin: present\n'
          else
            printf '#214 /mingw64/bin: ABSENT — the git PATH change is a no-op here\n'
          fi
          case "$(command -v git)" in
            /mingw64/*) printf '#214 git: real binary (launcher bypassed)\n' ;;
            /cmd/*)     printf '#214 git: STILL the /cmd launcher — two processes per call\n' ;;
            *)          printf '#214 git: unexpected location, see above\n' ;;
          esac
          case "$(command -v sort)" in
            /usr/bin/*) printf '#214 sort: still /usr/bin (no regression)\n' ;;
            *)          printf '#214 sort: MOVED off /usr/bin — check for a -u failure\n' ;;
          esac

      - name: Run script tests
        if: steps.cheap.outputs.cheap != 'true'
        shell: bash
        run: |
          export PATH="/usr/bin:/mingw64/bin:$HOME/bin:$PATH"
          bash scripts/run-tests.sh
