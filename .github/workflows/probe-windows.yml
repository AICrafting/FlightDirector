---
# THROWAWAY (#127). Final windows measurement: how close does it get once the
# two environment problems are handled?
#   1. MSYS /usr/bin ahead of System32, so `sort -u` is GNU sort and not
#      C:\Windows\System32\sort.exe (which has no -u and reports the flag as a
#      missing filename)
#   2. jq wrapped to emit LF, preserving its exit status via pipefail
# Delete before merge.
name: probe-windows-final
on:
  workflow_dispatch:
  pull_request: {}

jobs:
  final:
    name: probe windows (env fixed)
    runs-on: windows
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Tools
        shell: bash
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL -o "$HOME/bin/jq-real.exe" \
            https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-windows-amd64.exe
          cat >"$HOME/bin/jq" <<'SH'
          #!/bin/bash
          set -o pipefail
          "$HOME/bin/jq-real.exe" "$@" | tr -d '\r'
          SH
          sed -i 's/^          //' "$HOME/bin/jq"
          chmod +x "$HOME/bin/jq"

      - name: Which sort do we get, before and after
        shell: bash
        run: |
          echo "before: $(command -v sort)"
          export PATH="/usr/bin:$PATH"
          echo "after : $(command -v sort)"
          printf 'b\na\na\n' | sort -u | tr '\n' ' '; echo

      - name: Full suite
        continue-on-error: true
        shell: bash
        run: |
          export PATH="/usr/bin:$HOME/bin:$PATH"
          command -v jq sort
          bash scripts/run-tests.sh 2>&1 || true
