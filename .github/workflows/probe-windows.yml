---
# THROWAWAY (#127). A/B on the windows runner to isolate what actually breaks:
#   A = stock jq.exe          B = jq.exe wrapped so stdout is LF
# Identical otherwise, so the diff between them is exactly the CRLF-from-jq share.
# Both print the FULL suite output; the previous probe tailed it and hid the profile.
# Delete before merge.
name: probe-windows-ab
on:
  workflow_dispatch:
  pull_request: {}

jobs:
  ab:
    name: probe windows (${{ matrix.variant }})
    runs-on: windows
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [stock-jq, lf-wrapped-jq]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install jq (variant ${{ matrix.variant }})
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL -o "$HOME/bin/jq-real.exe" \
            https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-windows-amd64.exe
          if [ "$VARIANT" = "lf-wrapped-jq" ]; then
            printf '#!/bin/bash\nexec "$HOME/bin/jq-real.exe" "$@" | tr -d "\\r"\n' >"$HOME/bin/jq"
            chmod +x "$HOME/bin/jq"
          else
            cp "$HOME/bin/jq-real.exe" "$HOME/bin/jq.exe"
          fi
          export PATH="$HOME/bin:$PATH"
          command -v jq
          jq -rn '"probe"' | od -c | head -2

      - name: Line endings as checked out
        shell: bash
        run: |
          file flight/scripts/flight scripts/run-tests.sh 2>/dev/null || true
          head -1 flight/scripts/flight | od -c | head -2

      - name: Full suite
        continue-on-error: true
        shell: bash
        run: |
          export PATH="$HOME/bin:$PATH"
          bash scripts/run-tests.sh 2>&1 || true
