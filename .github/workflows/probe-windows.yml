---
# THROWAWAY (#127). Reports what the `windows` runner actually has so a real
# Windows leg can be written against facts rather than guesses. Read-only: every
# step only prints versions and tool locations. Delete before this PR merges.
name: probe-runners
on:
  workflow_dispatch:
  pull_request: {}

jobs:
  probe:
    name: probe windows runner
    runs-on: windows
    timeout-minutes: 5
    steps:
      # Each shell is tried independently: whichever ones exist will report, and
      # the ones that don't fail the step without aborting the job.
      - name: via cmd
        continue-on-error: true
        shell: cmd
        run: |
          ver
          echo PROCESSOR_ARCHITECTURE=%PROCESSOR_ARCHITECTURE%
          where bash
          where git
          where jq
          where curl
          where python3
          where python

      - name: via powershell
        continue-on-error: true
        shell: pwsh
        run: |
          $PSVersionTable | Out-String
          foreach ($t in 'bash', 'git', 'jq', 'curl', 'python3', 'sed', 'awk') {
            $c = Get-Command $t -ErrorAction SilentlyContinue
            if ($c) { "FOUND $t -> $($c.Source)" } else { "MISSING $t" }
          }

      - name: via bash
        continue-on-error: true
        shell: bash
        run: |
          uname -a
          echo "BASH_VERSION=$BASH_VERSION"
          bash --version | head -1
          for t in git jq curl python3 sed awk paste wc mktemp; do
            printf '%s -> %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done
          echo "--- process substitution ---"
          while IFS= read -r l; do echo "procsub ok: $l"; done < <(printf 'yes\n')
          echo "--- mktemp -d ---"
          d="$(mktemp -d)" && echo "mktemp -d -> $d"
          echo "--- git worktree ---"
          git --version

  probe-macos:
    name: probe macos runner
    runs-on: macos-arm64
    timeout-minutes: 5
    steps:
      - name: identity and tools
        continue-on-error: true
        run: |
          uname -a
          sw_vers || true
          echo "default bash: $(command -v bash)"
          bash --version | head -1
          echo "--- /bin/bash (the one a shebang gets without brew) ---"
          /bin/bash --version | head -1
          for t in git jq python3 sed awk paste wc mktemp shellcheck yamllint brew; do
            printf '%s -> %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done

  # Does the suite stand a chance on Windows at all? Git Bash is 5.3 so this cannot
  # test #127's bug, but it is the only way to find out what MSYS actually breaks.
  # jq is absent on the runner and flight requires it, so fetch a static binary.
  # python3 is absent too and there is no package manager, so the prompt-logger
  # tests are expected to fail; the point is to see the shape of the damage.
  probe-windows-suite:
    name: probe windows suite
    runs-on: windows
    timeout-minutes: 20
    steps:
      - name: Checkout
        continue-on-error: true
        uses: actions/checkout@v6

      - name: Install jq
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL -o "$HOME/bin/jq.exe" \
            https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-windows-amd64.exe
          "$HOME/bin/jq.exe" --version

      - name: Run the suite and report the profile
        continue-on-error: true
        shell: bash
        run: |
          export PATH="$HOME/bin:$PATH"
          command -v jq; jq --version || true
          bash scripts/run-tests.sh 2>&1 | tail -80 || true
