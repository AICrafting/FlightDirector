name: rig-pr-green
on:
  pull_request:
    branches:
      - 'rig/**'
jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - run: echo "RIG-GREEN-OUTPUT ok for ${GITHUB_SHA}"
