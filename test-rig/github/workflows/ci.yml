---
# Seeded by test-rig/github/up.sh into the target repo at .github/workflows/ci.yml.
# Trivial workflow so `flight ci watch/log` have a real Actions run to observe.
# Runs on push to rig/** branches only (keeps it out of the way of real work).
name: rig-ci
on:
  push:
    branches:
      - 'rig/**'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Check the branch out, as real workflows do and as the GitLab rig's job does: a run that
      # never fetches its ref cannot notice the ref has gone (#185).
      - uses: actions/checkout@v4
      - run: echo "rig ci ok for ${GITHUB_SHA}"
